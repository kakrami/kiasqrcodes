    function scheduleQR(){clearTimeout(qrTimer);qrTimer=setTimeout(generateQR,QR_DELAY);}
    function scheduleFrame(){clearTimeout(frameTimer);frameTimer=setTimeout(applyFrames,FRAME_DELAY);}

    function getLogoInfo(src) {
      if (!src) return Promise.resolve(null);
      if (logoInfoCache.has(src)) return logoInfoCache.get(src);

      const promise = new Promise(resolve => {
        const img = new Image();

        img.onload = () => {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          resolve(w && h ? { img, width: w, height: h } : null);
        };

        img.onerror = () => resolve(null);
        img.src = src;
      });

      logoInfoCache.set(src, promise);
      return promise;
    }

    function getQRModuleCount(qr) {
      const candidates = [
        qr && qr._qr,
        qr && qr._qrCode,
        qr && qr._qrcode,
        qr && qr.qrCode,
        qr && qr.qrcode,
        qr && qr._oQRCode,
        qr && qr._drawing && qr._drawing._qr,
        qr && qr._canvas && qr._canvas._qr,
        qr && qr._svg && qr._svg._qr
      ];

      for (const item of candidates) {
        if (!item) continue;
        if (typeof item.getModuleCount === 'function') return item.getModuleCount();
        if (Number.isFinite(item.moduleCount)) return item.moduleCount;
        if (Number.isFinite(item.modulesCount)) return item.modulesCount;
      }

      if (qr && typeof qr === 'object') {
        for (const key in qr) {
          const item = qr[key];
          if (!item || typeof item !== 'object') continue;
          if (typeof item.getModuleCount === 'function') return item.getModuleCount();
          if (Number.isFinite(item.moduleCount)) return item.moduleCount;
          if (Number.isFinite(item.modulesCount)) return item.modulesCount;
        }
      }

      return null;
    }

    function fitRectToAspect(maxW, maxH, aspect) {
      let w = maxW;
      let h = w / aspect;

      if (h > maxH) {
        h = maxH;
        w = h * aspect;
      }

      return { w, h };
    }

    function snapDownToQRGrid(value, gridStart, moduleSize) {
      return gridStart + Math.floor((value - gridStart) / moduleSize) * moduleSize;
    }

    function snapUpToQRGrid(value, gridStart, moduleSize) {
      return gridStart + Math.ceil((value - gridStart) / moduleSize) * moduleSize;
    }

    function getLogoMetrics(logoInfo, moduleCount, sizeFraction = logoSize, paddingModules = logoPaddingModules, canvasSize = SIZE) {
      if (!logoInfo) return null;

      const safeModuleCount = Number.isFinite(moduleCount) && moduleCount > 0 ? moduleCount : 41;
      const layout = getQRLayout(safeModuleCount, canvasSize);
      const aspect = logoInfo.width / logoInfo.height;
      const maxLogoW = layout.qrSize * sizeFraction;
      const maxLogoH = layout.qrSize * sizeFraction;
      const fitted = fitRectToAspect(maxLogoW, maxLogoH, aspect);
      const imageModulesW = Math.max(1, Math.min(safeModuleCount, Math.round(fitted.w / layout.moduleSize)));
      const imageModulesH = Math.max(1, Math.min(safeModuleCount, Math.round(fitted.h / layout.moduleSize)));
      const requestedPad = Math.max(0, Math.round(paddingModules));
      const maxPadW = Math.floor((safeModuleCount - imageModulesW) / 2);
      const maxPadH = Math.floor((safeModuleCount - imageModulesH) / 2);
      const padModules = Math.max(0, Math.min(requestedPad, maxPadW, maxPadH));
      const modulesW = imageModulesW + padModules * 2;
      const modulesH = imageModulesH + padModules * 2;

      return {
        ...layout,
        aspect,
        imageModulesW,
        imageModulesH,
        padModules,
        modulesW,
        modulesH,
        moduleCount: safeModuleCount,
        areaRatio: (modulesW * modulesH) / (safeModuleCount * safeModuleCount)
      };
    }

    function createQrCandidate(txt, level) {
      try {
        const qr = new QRCodeStyling({
          width:128,height:128,margin:0,data:txt,
          dotsOptions:{ type:'square', color:'#000000' },
          backgroundOptions:{ color:'#ffffff' },
          qrOptions:{errorCorrectionLevel:level}
        });
        const model = getQRModel(qr);
        if (!model) return null;
        return { level, moduleCount: model.getModuleCount() };
      } catch (error) {
        return null;
      }
    }

    function isLogoSafeForLevel(logoInfo, moduleCount, level, sizeFraction = logoSize, paddingModules = logoPaddingModules) {
      if (!logoInfo) return true;
      const metrics = getLogoMetrics(logoInfo, moduleCount, sizeFraction, paddingModules);
      return !!metrics && metrics.areaRatio <= (SAFE_LOGO_AREA_BY_EC[level] || SAFE_LOGO_AREA_BY_EC.H);
    }

    function getMaxSafePadding(logoInfo, moduleCount, level, sizeFraction = logoSize) {
      if (!logoInfo) return Number($('#logoPaddingDial').attr('data-base-max')) || 6;
      const baseMax = Number($('#logoPaddingDial').attr('data-base-max')) || 6;
      let maxSafe = 0;
      for (let pad = 0; pad <= baseMax; pad++) {
        if (isLogoSafeForLevel(logoInfo, moduleCount, level, sizeFraction, pad)) maxSafe = pad;
        else break;
      }
      return maxSafe;
    }

    function setStablePaddingLimit(logoInfo, candidates) {
      const strongestLevel = ERROR_CORRECTION_FALLBACK_ORDER.find(level => candidates[level]);
      const strongest = strongestLevel ? candidates[strongestLevel] : null;
      const baseMax = Number($('#logoPaddingDial').attr('data-base-max')) || 6;
      const maxPadding = strongest && logoInfo
        ? getMaxSafePadding(logoInfo, strongest.moduleCount, strongest.level, logoSize)
        : baseMax;

      $('#logoPaddingDial').attr('max', maxPadding);
      if (logoPaddingModules > maxPadding) {
        logoPaddingModules = maxPadding;
        $('#logoPaddingDial').val(maxPadding);
        updateLogoPaddingLabel();
      }
    }

    function getSafeLevelOrder(preference) {
      if (preference === 'AUTO') return AUTO_ERROR_CORRECTION_ORDER;
      const index = ERROR_CORRECTION_LEVELS.indexOf(preference);
      if (index < 0) return AUTO_ERROR_CORRECTION_ORDER;
      return ERROR_CORRECTION_LEVELS.slice(index);
    }

    function selectErrorCorrection(txt, logoInfo) {
      const candidates = {};
      ERROR_CORRECTION_LEVELS.forEach(level => {
        const candidate = createQrCandidate(txt, level);
        if (candidate) candidates[level] = candidate;
      });

      if (!Object.keys(candidates).length) {
        throw new Error('The current text is too long to encode as a QR code.');
      }

      // The padding slider's maximum is based on the strongest usable level and
      // therefore stays stable while the user drags it. Generation never rewrites
      // the padding value in response to the padding value itself.
      setStablePaddingLimit(logoInfo, candidates);

      const preferredOrder = getSafeLevelOrder(errorCorrectionPreference);
      for (const level of preferredOrder) {
        const candidate = candidates[level];
        if (!candidate) continue;
        if (!logoInfo || isLogoSafeForLevel(logoInfo, candidate.moduleCount, level)) {
          const metrics = logoInfo ? getLogoMetrics(logoInfo, candidate.moduleCount) : null;
          return { ...candidate, areaRatio: metrics ? metrics.areaRatio : 0 };
        }
      }

      // If the requested level cannot carry the text, use the nearest available
      // level. If the image area is unusually large, prefer the strongest level.
      const fallbackLevel = ERROR_CORRECTION_FALLBACK_ORDER.find(level => candidates[level]);
      const fallback = candidates[fallbackLevel];
      const metrics = logoInfo ? getLogoMetrics(logoInfo, fallback.moduleCount) : null;
      return { ...fallback, areaRatio: metrics ? metrics.areaRatio : 0 };
    }

    function getQRLayout(moduleCount, canvasSize = SIZE) {
      const usable = canvasSize - (QR_MARGIN * 2);
      const moduleSize = Math.max(1, Math.floor(usable / moduleCount));
      const qrSize = moduleSize * moduleCount;
      const qrStart = Math.round((canvasSize - qrSize) / 2);
      return { moduleSize, qrSize, qrStart };
    }

    function getLogoReservedArea(logoInfo, moduleCount, canvasSize = SIZE) {
      const metrics = getLogoMetrics(logoInfo, moduleCount, logoSize, logoPaddingModules, canvasSize);
      if (!metrics) return null;

      const moduleX = Math.floor((metrics.moduleCount - metrics.modulesW) / 2);
      const moduleY = Math.floor((metrics.moduleCount - metrics.modulesH) / 2);
      const clearX = metrics.qrStart + moduleX * metrics.moduleSize;
      const clearY = metrics.qrStart + moduleY * metrics.moduleSize;
      const clearW = metrics.modulesW * metrics.moduleSize;
      const clearH = metrics.modulesH * metrics.moduleSize;
      const innerX = clearX + metrics.padModules * metrics.moduleSize;
      const innerY = clearY + metrics.padModules * metrics.moduleSize;
      const innerW = Math.max(metrics.moduleSize, clearW - metrics.padModules * 2 * metrics.moduleSize);
      const innerH = Math.max(metrics.moduleSize, clearH - metrics.padModules * 2 * metrics.moduleSize);
      const draw = fitRectToAspect(innerW, innerH, metrics.aspect);

      return {
        moduleX,
        moduleY,
        modulesW: metrics.modulesW,
        modulesH: metrics.modulesH,
        clearX,
        clearY,
        clearW,
        clearH,
        padModules: metrics.padModules,
        drawX: innerX + (innerW - draw.w) / 2,
        drawY: innerY + (innerH - draw.h) / 2,
        drawW: draw.w,
        drawH: draw.h,
        moduleSize: metrics.moduleSize,
        qrStart: metrics.qrStart,
        qrSize: metrics.qrSize,
        moduleCount: metrics.moduleCount
      };
    }

    function getQRModel(qr) {
      const candidates = [
        qr && qr._qr,
        qr && qr._qrCode,
        qr && qr._qrcode,
        qr && qr.qrCode,
        qr && qr.qrcode,
        qr && qr._oQRCode
      ];

      for (const item of candidates) {
        if (item && typeof item.isDark === 'function' && typeof item.getModuleCount === 'function') {
          return item;
        }
      }

      if (qr && typeof qr === 'object') {
        for (const key in qr) {
          const item = qr[key];
          if (item && typeof item === 'object' && typeof item.isDark === 'function' && typeof item.getModuleCount === 'function') {
            return item;
          }
        }
      }

      return null;
    }

    function buildRoundedRectPath(ctx, x, y, w, h, radii) {
      const [tl, tr, br, bl] = radii.map(r => Math.max(0, Math.min(r, Math.min(w, h) / 2)));
      ctx.beginPath();
      ctx.moveTo(x + tl, y);
      ctx.lineTo(x + w - tr, y);
      if (tr) ctx.quadraticCurveTo(x + w, y, x + w, y + tr); else ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h - br);
      if (br) ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h); else ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + bl, y + h);
      if (bl) ctx.quadraticCurveTo(x, y + h, x, y + h - bl); else ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + tl);
      if (tl) ctx.quadraticCurveTo(x, y, x + tl, y); else ctx.lineTo(x, y);
      ctx.closePath();
    }

    function drawStyledModule(ctx, x, y, size, style, neighbors = {}) {
      const bleed = Math.max(0.35, size * 0.035);
      const bx = x - bleed;
      const by = y - bleed;
      const bs = size + bleed * 2;

      if (style === 'dots') {
        ctx.beginPath();
        ctx.arc(x + size / 2, y + size / 2, (size / 2) + bleed, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      if (style === 'square') {
        ctx.fillRect(bx, by, bs, bs);
        return;
      }

      const roundedAmount = style === 'extra-rounded' ? 0.34 :
        style === 'classy-rounded' ? 0.42 :
        style === 'classy' ? 0.28 : 0.18;
      const r = bs * roundedAmount;

      let radii;
      if (style === 'classy' || style === 'classy-rounded') {
        radii = [
          (!neighbors.top && !neighbors.left) ? r : 0,
          0,
          (!neighbors.bottom && !neighbors.right) ? r : 0,
          0
        ];
      } else {
        radii = [
          (!neighbors.top && !neighbors.left) ? r : 0,
          (!neighbors.top && !neighbors.right) ? r : 0,
          (!neighbors.bottom && !neighbors.right) ? r : 0,
          (!neighbors.bottom && !neighbors.left) ? r : 0
        ];
      }

      buildRoundedRectPath(ctx, bx, by, bs, bs, radii);
      ctx.fill();
    }

    function createCanvasPaint(ctx, paint, width, height, offsetX = 0, offsetY = 0) {
      if (!paint || paint.type !== 'gradient') return (paint && paint.color1) || '#000000';

      const angle=((Number(paint.angle) || 0) - 90) * Math.PI / 180;
      const cos=Math.cos(angle);
      const sin=Math.sin(angle);
      const halfLength=(Math.abs(width * cos) + Math.abs(height * sin)) / 2;
      const centerX=offsetX + width / 2;
      const centerY=offsetY + height / 2;
      const gradient=ctx.createLinearGradient(
        centerX - cos * halfLength,
        centerY - sin * halfLength,
        centerX + cos * halfLength,
        centerY + sin * halfLength
      );
      gradient.addColorStop(0, paint.color1 || '#000000');
      gradient.addColorStop(1, paint.color2 || paint.color1 || '#000000');
      return gradient;
    }

    function drawQRToCanvas(qr, logoInfo, options = {}) {
      const qrModel = getQRModel(qr);
      const moduleCount = qrModel ? qrModel.getModuleCount() : 41;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const bgPaint = bgColorPicker.getPaint();
      const fgPaint = fgColorPicker.getPaint();
      const dotStyle = qrStyle || 'rounded';
      const layout = getQRLayout(moduleCount, SIZE);
      const moduleSize = layout.moduleSize;
      const reserved = getLogoReservedArea(logoInfo, moduleCount, SIZE);
      const useTransparentBackground = !!options.useTransparentBackground;

      if (!useTransparentBackground) {
        ctx.fillStyle = createCanvasPaint(ctx, bgPaint, SIZE, SIZE);
        ctx.fillRect(0, 0, SIZE, SIZE);
      } else {
        ctx.clearRect(0, 0, SIZE, SIZE);
      }
      ctx.fillStyle = createCanvasPaint(ctx, fgPaint, SIZE, SIZE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const isReservedModule = (r, c) => {
        return !!(
          reserved &&
          c >= reserved.moduleX &&
          c < reserved.moduleX + reserved.modulesW &&
          r >= reserved.moduleY &&
          r < reserved.moduleY + reserved.modulesH
        );
      };
      const isVisibleDark = (r, c) => {
        return !!(
          qrModel &&
          r >= 0 && c >= 0 &&
          r < moduleCount && c < moduleCount &&
          qrModel.isDark(r, c) &&
          !isReservedModule(r, c)
        );
      };

      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          if (!isVisibleDark(row, col)) continue;

          const x = layout.qrStart + col * moduleSize;
          const y = layout.qrStart + row * moduleSize;
          drawStyledModule(ctx, x, y, moduleSize, dotStyle, {
            top: isVisibleDark(row - 1, col),
            right: isVisibleDark(row, col + 1),
            bottom: isVisibleDark(row + 1, col),
            left: isVisibleDark(row, col - 1)
          });
        }
      }

      if (reserved && logoInfo) {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(
          logoInfo.img,
          Math.round(reserved.drawX),
          Math.round(reserved.drawY),
          Math.round(reserved.drawW),
          Math.round(reserved.drawH)
        );
        ctx.restore();
      }

      return canvas;
    }

    async function generateQR(){
      const runId = ++qrRunId;
      const txt=$('#qrtext').val().trim();
      if(!txt){
        $('#qrcode').empty();
        $('#downloadQrBtn').prop('disabled', true);
        baseCanvas=null;
        return;
      }

      const logoInfo = await getLogoInfo(selectedLogo);
      if (runId !== qrRunId) return;

      try {
        const selectedCorrection = selectErrorCorrection(txt, logoInfo);
        errorCorrectionLevel = selectedCorrection.level;
        updateErrorCorrectionLabel();

        const qr=new QRCodeStyling({
          width:SIZE,height:SIZE,margin:QR_MARGIN,data:txt,
          dotsOptions:{ type: qrStyle, color: fgColorPicker.getPaint().color1 },
          backgroundOptions:{ color: bgColorPicker.getPaint().color1 },
          qrOptions:{errorCorrectionLevel:errorCorrectionLevel}
        });

        const hasUnifiedTemplateBackground = !!getTemplateOptions();
        baseCanvas = drawQRToCanvas(qr, logoInfo, {
          useTransparentBackground: hasUnifiedTemplateBackground
        });
        scheduleFrame();
      } catch (error) {
        baseCanvas = null;
        finalCanvas = null;
        $('#downloadQrBtn').prop('disabled', true);
        $('#qrcode').empty().append(
          $('<div>').addClass('text-danger small p-3 text-center').text(error && error.message ? error.message : 'Unable to generate this QR code.')
        );
      }
    }

    function getTemplateOptions() {
      const enabled = $('#templateEnabled').prop('checked');
      const text = $('#templateText').val().trim();
      if (!enabled || !text) return null;

      return {
        text,
        side: $('#templateSide').val(),
        font: $('#templateFont').val(),
        weight: $('#templateWeight').val(),
        size: Math.max(12, Number($('#templateFontSize').val()) || 48),
        gap: Math.max(0, Number($('#templateGap').val()) || 0),
        colorPaint: templateTextColorPicker ? templateTextColorPicker.getPaint() : {type:'solid',color1:'#ffffff',color2:'#ffffff',angle:90},
        bgPaint: bgColorPicker.getPaint()
      };
    }

    function getFittedFont(ctx, lines, opt, maxWidth) {
      const requestedSize = Math.max(12 * CANVAS_SCALE, opt.size);
      const contentLines = Array.isArray(lines) ? lines : [String(lines)];
      ctx.font = `${opt.weight} ${requestedSize}px ${opt.font}`;

      const widest = Math.max(...contentLines.map(line => ctx.measureText(line || ' ').width));
      if (!widest || widest <= maxWidth) return requestedSize;

      // The width cap is independent of the requested font size. This makes the
      // dial monotonic: increasing it can grow or plateau, but never shrink text.
      const fitted = requestedSize * (maxWidth / widest);
      return Math.max(12 * CANVAS_SCALE, Math.min(requestedSize, fitted));
    }

    function drawTemplateLines(ctx, lines, centerX, centerY, lineHeight) {
      const totalHeight = lineHeight * lines.length;
      const firstY = centerY - (totalHeight - lineHeight) / 2;
      lines.forEach((line, index) => {
        ctx.fillText(line, centerX, firstY + index * lineHeight);
      });
    }

    function drawTemplate(canvas) {
      const opt = getTemplateOptions();
      if (!opt) return canvas;

      const scaledOpt = {
        ...opt,
        size: opt.size * CANVAS_SCALE,
        gap: opt.gap * CANVAS_SCALE
      };
      const lines = scaledOpt.text.split(/\r?\n/);
      const isVertical = scaledOpt.side === 'left' || scaledOpt.side === 'right';
      // Keep horizontal padding stable so raising the font-size dial does not
      // reduce the available width and unexpectedly make the text smaller.
      const padding = 24 * CANVAS_SCALE;
      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      const availableTextWidth = Math.max(
        12 * CANVAS_SCALE,
        (isVertical ? canvas.height : canvas.width) - padding * 2
      );
      const fittedSize = getFittedFont(measureCtx, lines, scaledOpt, availableTextWidth);
      const lineHeight = fittedSize * 1.2;
      const textBlockHeight = Math.max(lineHeight, lineHeight * lines.length);
      const strip = Math.max(1, Math.ceil(textBlockHeight + scaledOpt.gap + padding * 2));
      const out = document.createElement('canvas');
      out.width = isVertical ? canvas.width + strip : canvas.width;
      out.height = isVertical ? canvas.height : canvas.height + strip;

      const ctx = out.getContext('2d');
      ctx.fillStyle = createCanvasPaint(ctx, scaledOpt.bgPaint, out.width, out.height);
      ctx.fillRect(0, 0, out.width, out.height);

      const qrX = scaledOpt.side === 'left' ? strip : 0;
      const qrY = scaledOpt.side === 'top' ? strip : 0;
      ctx.drawImage(canvas, qrX, qrY);

      ctx.fillStyle = createCanvasPaint(ctx, scaledOpt.colorPaint, out.width, out.height);
      ctx.font = `${scaledOpt.weight} ${fittedSize}px ${scaledOpt.font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (scaledOpt.side === 'top' || scaledOpt.side === 'bottom') {
        const y = scaledOpt.side === 'top' ? strip / 2 : canvas.height + strip / 2;
        drawTemplateLines(ctx, lines, out.width / 2, y, lineHeight);
      } else {
        const x = scaledOpt.side === 'left' ? strip / 2 : canvas.width + strip / 2;
        ctx.save();
        ctx.translate(x, out.height / 2);
        ctx.rotate(scaledOpt.side === 'left' ? -Math.PI / 2 : Math.PI / 2);
        drawTemplateLines(ctx, lines, 0, 0, lineHeight);
        ctx.restore();
      }

      return out;
    }

    function applyFrames(){
      if(!baseCanvas)return;
      const frames=getFrames().map(f => ({
        paint: f.paint || {type:'solid',color1:f.color || '#000000',color2:f.color || '#000000',angle:90},
        thickness: f.thickness * CANVAS_SCALE,
        outerFill: !!f.outerFill
      }));
      let canvas;
      if(!frames.length){
        canvas=document.createElement('canvas');
        canvas.width=baseCanvas.width;
        canvas.height=baseCanvas.height;
        canvas.getContext('2d').drawImage(baseCanvas,0,0);
      }
      else{
        const base=baseCanvas.width;
        const border=frames.reduce((s,f)=>s+f.thickness,0);
        const size=base+2*border;
        canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext('2d');
        ctx.clearRect(0,0,size,size);
        let off=0;
        for(let i=frames.length-1;i>=0;i--){
          const f=frames[i],side=size-2*off;
          const distanceFromQr=border-off;
          const radius=Math.min(QR_CORNER_RADIUS+distanceFromQr,side/2);
          ctx.fillStyle=createCanvasPaint(ctx, f.paint, side, side, off, off);
          if (f.outerFill) {
            ctx.fillRect(off, off, side, side);
          } else {
            ctx.beginPath();
            ctx.roundRect(off,off,side,side,radius);
            ctx.fill();
          }
          off+=f.thickness;
        }
        const innerRadius = Math.min(QR_CORNER_RADIUS, base / 2);

        // Remove every frame layer from beneath the QR itself before drawing
        // the QR canvas. This is required when Template is enabled because the
        // QR canvas intentionally has a transparent background so the one main
        // Background paint can continue across both the QR and text areas.
        // Without clearing this area, the innermost frame color shows through
        // that transparency and incorrectly becomes the QR background.
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.roundRect(border, border, base, base, innerRadius);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(border, border, base, base, innerRadius);
        ctx.clip();
        ctx.drawImage(baseCanvas, border, border);
        ctx.restore();
      }
      canvas = drawTemplate(canvas);
      finalCanvas = canvas;
      $('#qrcode').empty().append(canvas);
      $('#downloadQrBtn').prop('disabled', false);
    }

    $('#mobilePreviewToggle').on('click', function() {
      const panel = $('#previewPanel');
      const expanded = !panel.hasClass('mobile-preview-expanded');
      panel.toggleClass('mobile-preview-expanded', expanded);
      $(this)
        .attr('aria-expanded', String(expanded))
        .attr('aria-label', expanded ? 'Restore compact QR preview' : 'Maximize QR preview')
        .attr('title', expanded ? 'Restore compact QR preview' : 'Maximize QR preview');

      // Recalculate an open font menu after the sticky preview changes height.
      $(window).trigger('resize.fontPreview');
    });

    $('#downloadQrBtn').on('click', function() {
      const canvas = finalCanvas || $('#qrcode canvas')[0];
      if (!canvas) return;

      try {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'qr-code.png';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
      } catch (error) {
        // Fallback for browsers that cannot create a data URL for this canvas.
        if (!canvas.toBlob) return;
        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'qr-code.png';
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, 'image/png');
      }
    });

    scheduleQR();
  </script>
</body>
</html>
