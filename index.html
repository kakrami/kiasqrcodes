<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kia's QR-Codes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="src/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/css/styles.css">

  <style>

    .control-card-title {
      color: #6c757d;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .container-card {
      max-width: 1280px;
    }
    @media (min-width: 992px) {
      .preview-column {
        min-width: 0;
      }
      .preview-qr-wrap {
        justify-content: center;
      }
      #qrcode.blank-bg {
        margin-inline: auto;
        max-width: 460px;
      }
    }
    @media (min-width: 1200px) {
      .container-card .row > .col-lg-4:not(.preview-column) {
        flex: 0 0 31%;
        max-width: 31%;
      }
      .container-card .preview-column {
        flex: 0 0 38%;
        max-width: 38%;
      }
    }
    .preview-panel {
      align-items: start;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) 34px;
      position: sticky;
      top: 20px;
      width: 100%;
    }
    .preview-qr-wrap {
      min-width: 0;
      width: 100%;
    }
    .advanced-panel {
      overflow: hidden;
    }
    .advanced-toggle {
      align-items: center;
      background: transparent;
      border: 0;
      color: #6c757d;
      cursor: pointer;
      display: flex;
      font-size: 0.95rem;
      font-weight: 700;
      justify-content: space-between;
      padding: 0;
      text-align: left;
      width: 100%;
    }
    .advanced-chevron {
      font-size: 12px;
      transition: transform .24s ease;
    }
    .advanced-panel.open .advanced-chevron {
      transform: rotate(180deg);
    }
    .advanced-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height .28s ease, opacity .22s ease;
      will-change: max-height, opacity;
    }
    .advanced-panel.open .advanced-content {
      opacity: 1;
    }
    .advanced-content-inner {
      padding-top: 5px;
    }
    .advanced-settings-grid {
      display: grid;
      gap: 4px;
      grid-template-columns: 1fr;
    }
    .advanced-field {
      align-items: center;
      display: grid;
      gap: 6px;
      grid-template-columns: 82px minmax(0, 1fr) auto;
      min-width: 0;
    }
    .advanced-field > .form-label {
      color: #6c757d;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.05;
      margin: 0;
    }
    .advanced-range-wrap {
      min-width: 0;
    }
    .setting-value-pill {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 999px;
      color: #495057;
      font-size: 10px;
      font-weight: 700;
      min-width: 42px;
      padding: 1px 6px;
      text-align: center;
    }
    .range-modern {
      --range-fill: 100%;
      appearance: none;
      background: transparent;
      cursor: pointer;
      height: 22px;
      padding: 0;
    }
    .range-modern:focus {
      outline: none;
    }
    .range-modern::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #0d6efd var(--range-fill), #dfe5ec var(--range-fill));
      border-radius: 999px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
      height: 8px;
    }
    .range-modern::-webkit-slider-thumb {
      appearance: none;
      background: #fff;
      border: 3px solid #0d6efd;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(13, 110, 253, .32);
      height: 20px;
      margin-top: -6px;
      transition: transform .12s ease, box-shadow .12s ease;
      width: 20px;
    }
    .range-modern:active::-webkit-slider-thumb {
      box-shadow: 0 3px 10px rgba(13, 110, 253, .42);
      transform: scale(1.08);
    }
    .range-modern::-moz-range-track {
      background: #dfe5ec;
      border-radius: 999px;
      height: 8px;
    }
    .range-modern::-moz-range-progress {
      background: #0d6efd;
      border-radius: 999px;
      height: 8px;
    }
    .range-modern::-moz-range-thumb {
      background: #fff;
      border: 3px solid #0d6efd;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(13, 110, 253, .28);
      height: 16px;
      width: 16px;
    }
    .range-stop-labels {
      color: #6c757d;
      font-size: 9px;
      font-weight: 700;
      height: 12px;
      margin: -4px 0 0;
      position: relative;
    }
    .range-stop-labels span {
      left: calc(10px + (var(--pos) * (100% - 20px)));
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .range-note {
      color: #6c757d;
      font-size: 9px;
      line-height: 1.15;
      margin-top: 2px;
      min-height: 10px;
    }
    .range-note.warning {
      color: #b45309;
      font-weight: 600;
    }
    .image-size-control {
      font-size: 13px;
    }
    .image-size-control + .image-size-control {
      margin-top: 2px;
    }
    .image-control-label {
      flex: 0 0 86px;
      min-width: 86px;
    }
    .image-size-control input[type="range"] {
      width: 100%;
    }
    .image-adjustment-note {
      margin-left: 88px;
      min-height: 11px;
    }
    .auto-setting-copy {
      color: #6c757d;
      font-size: 10px;
      line-height: 1.15;
      min-width: 0;
    }
    .advanced-help-copy {
      grid-column: 2 / 4;
      margin-top: -2px;
    }
    .error-correction-labels {
      margin-top: -3px;
    }
    #errorCorrectionValue {
      min-width: 58px;
    }
    .error-correction-field {
      display: block;
    }
    .error-correction-field .advanced-field-label {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .error-correction-field .advanced-field-label .form-label {
      color: #6c757d;
      font-size: 12px;
      font-weight: 600;
      margin: 0;
    }
    .error-correction-field .advanced-range-wrap {
      width: 100%;
    }
    .error-correction-field .ec-labels {
      color: #6c757d;
      font-size: 10px;
      font-weight: 700;
      height: 16px;
      margin: -2px 10px 0;
      position: relative;
    }
    .error-correction-field .ec-labels span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .error-correction-field .advanced-help-copy {
      margin-top: 2px;
    }
    .image-size-value {
      min-width: 42px;
      text-align: right;
      font-weight: 600;
      color: #495057;
    }

    .font-native-select,
    .styled-native-select {
      height: 1px !important;
      left: -9999px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
      width: 1px !important;
    }
    .font-preview-picker {
      position: relative;
    }
    .font-preview-button {
      align-items: center;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: .25rem;
      color: #212529;
      display: flex;
      font-size: 14px;
      gap: 8px;
      height: 31px;
      justify-content: space-between;
      line-height: 1.2;
      overflow: hidden;
      padding: 4px 9px;
      text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease;
      width: 100%;
    }
    .font-preview-button:hover,
    .font-preview-picker.open .font-preview-button {
      border-color: #86b7fe;
    }
    .font-preview-button:focus-visible {
      border-color: #86b7fe;
      box-shadow: 0 0 0 .2rem rgba(13,110,253,.25);
      outline: 0;
    }
    .font-preview-button-text {
      display: block;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .font-preview-chevron {
      color: #6c757d;
      flex: 0 0 auto;
      font-family: Arial, sans-serif;
      font-size: 12px;
      transition: transform .18s ease;
    }
    .font-preview-picker.open .font-preview-chevron {
      transform: rotate(180deg);
    }
    .font-preview-menu {
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,.16);
      left: auto;
      max-height: 310px;
      max-width: calc(100vw - 24px);
      min-width: 100%;
      opacity: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 5px;
      pointer-events: none;
      position: absolute;
      right: 0;
      top: calc(100% + 5px);
      width: max-content;
      transform: translateY(-5px) scale(.985);
      transform-origin: top center;
      transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
      visibility: hidden;
      z-index: 1080;
    }
    .font-preview-picker.open .font-preview-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      visibility: visible;
    }
    .font-preview-menu.open-up {
      bottom: calc(100% + 5px);
      top: auto;
      transform: translateY(5px) scale(.985);
      transform-origin: bottom center;
    }
    .font-preview-picker.open .font-preview-menu.open-up {
      transform: translateY(0) scale(1);
    }
    .font-preview-group-label {
      color: #6c757d;
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 7px 8px 4px;
      text-transform: uppercase;
    }
    .font-preview-option {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 5px;
      color: #212529;
      cursor: pointer;
      display: grid;
      gap: 9px;
      grid-template-columns: 46px minmax(0,1fr);
      min-height: 38px;
      padding: 5px 8px;
      text-align: left;
      width: 100%;
    }
    .font-preview-option:hover,
    .font-preview-option:focus-visible {
      background: #f1f5f9;
      outline: 0;
    }
    .font-preview-option.selected {
      background: #e7f1ff;
      color: #0d6efd;
    }
    .font-preview-sample {
      font-size: 19px;
      line-height: 1;
      text-align: center;
    }
    .font-preview-name {
      font-size: 14px;
      line-height: 1.15;
      white-space: nowrap;
    }
    .uniform-select-menu {
      max-height: 220px;
      width: 100%;
    }
    .uniform-select-option {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: #212529;
      cursor: pointer;
      display: flex;
      font-size: 14px;
      min-height: 36px;
      padding: 7px 9px;
      text-align: left;
      width: 100%;
    }
    .uniform-select-option:hover,
    .uniform-select-option:focus-visible {
      background: #f1f5f9;
      outline: 0;
    }
    .uniform-select-option.selected {
      background: #e7f1ff;
      color: #0d6efd;
      font-weight: 600;
    }
    .template-control-card {
      font-size: 13px;
    }
    .template-control-title {
      font-weight: 600;
      color: #6c757d;
    }
    .template-control-card .form-label {
      margin-bottom: 3px;
      color: #6c757d;
      font-size: 12px;
      font-weight: 600;
    }
    .template-size-value,
    .template-gap-value {
      min-width: 38px;
      text-align: right;
      font-weight: 600;
      color: #495057;
    }
    .template-color-picker .color-display {
      height: 34px;
      border-radius: 6px;
    }
    .template-color-line {
      display: block;
    }
    .template-color-line .template-color-picker {
      min-width: 0;
      width: 100%;
    }
    .template-color-match {
      align-items: center;
      color: #6c757d;
      display: flex;
      font-size: 11px;
      gap: 4px;
      line-height: 1;
      margin: 0 0 5px;
      white-space: nowrap;
    }
    .template-color-match input {
      height: 13px;
      margin: 0;
      width: 13px;
    }
    .color-pair-grid {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
    }
    .color-swap-btn {
      align-items: center;
      align-self: center;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 50%;
      color: #495057;
      display: inline-flex;
      font-size: 17px;
      height: 32px;
      justify-content: center;
      padding: 0;
      transition: border-color .16s ease, box-shadow .16s ease, color .16s ease, transform .16s ease;
      width: 32px;
    }
    .color-swap-btn:hover {
      border-color: #0d6efd;
      box-shadow: 0 2px 8px rgba(13,110,253,.2);
      color: #0d6efd;
      transform: rotate(180deg);
    }
    .template-color-pair {
      margin-bottom: .5rem;
    }
    .palette-suggestion-divider {
      background: #dee2e6;
      flex-basis: 100%;
      height: 1px;
      margin: 4px 0 5px;
    }
    .color-swatch.image-suggested-swatch {
      box-shadow: 0 0 0 1px rgba(13,110,253,.18);
    }
    .frame-item {
      padding: 0 !important;
    }
    .remove-frame-btn {
      right: 2px !important;
    }
    .frame-controls {
      align-items: center;
      display: grid;
      flex: 1 1 auto;
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) 45px;
      min-width: 0;
      padding-right: 22px;
      width: auto;
    }
    .frame-color-group {
      align-items: center;
      display: grid;
      gap: 7px;
      grid-template-columns: minmax(64px, 1fr) auto;
      min-height: 38px;
      min-width: 0;
    }
    .frame-color-picker {
      align-items: center;
      align-self: stretch;
      display: flex;
      height: auto;
      min-width: 0;
      width: 100%;
    }
    .frame-color-picker .color-picker-container {
      margin-bottom: 0;
      width: 100%;
    }
    .frame-color-picker .color-display {
      margin-bottom: 0;
      width: 100%;
    }
    .frame-thickness-wrap {
      align-items: center;
      display: flex;
      justify-content: flex-end;
      width: 45px;
    }
    .frame-thickness-input,
    .form-control.frame-thickness-input {
      flex: 0 0 45px;
      max-width: 45px;
      min-width: 45px;
      width: 45px;
    }
    .frame-match-options {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0;
    }
    .frame-color-match {
      align-items: center;
      color: #6c757d;
      display: inline-flex;
      font-size: 10px;
      gap: 3px;
      line-height: 1;
      white-space: nowrap;
    }
    .frame-color-match input {
      height: 12px;
      margin: 0;
      width: 12px;
    }
    #framesContainer {
      max-height: none;
      overflow-y: visible;
      scrollbar-gutter: stable;
    }
    #framesContainer.frames-scroll-active {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 3px;
    }
    .preview-control-stack {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview-icon-button {
      align-items: center;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 8px;
      color: #495057;
      display: inline-flex;
      height: 34px;
      justify-content: center;
      padding: 0;
      transition: border-color .15s ease, box-shadow .15s ease, color .15s ease, background-color .15s ease;
      width: 34px;
    }
    .preview-icon-button:hover,
    .preview-icon-button:focus-visible {
      background: #f8f9fa;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,.12);
      color: #0d6efd;
      outline: 0;
    }
    .preview-icon-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }
    .preview-icon-button svg {
      display: block;
      height: 17px;
      width: 17px;
    }
    #templateText {
      min-height: 70px;
      resize: vertical;
    }
    .preview-side {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 34px;
    }
    .mobile-preview-toggle {
      display: none;
    }
    .mobile-preview-toggle .preview-icon-restore {
      display: none;
    }
    .mobile-preview-toggle[aria-expanded="true"] .preview-icon-expand {
      display: none;
    }
    .mobile-preview-toggle[aria-expanded="true"] .preview-icon-restore {
      display: block;
    }

    /* Mobile configurator UX: keep a compact live preview visible while editing. */
    @media (max-width: 991.98px) {
      body {
        align-items: flex-start;
        padding: 10px 7px 28px;
      }
      .container-card {
        padding: 12px !important;
      }
      .preview-column {
        align-self: flex-start;
        order: -1;
        position: sticky;
        top: max(6px, env(safe-area-inset-top));
        z-index: 1020;
      }
      .preview-panel {
        align-items: stretch;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255,255,255,.94);
        border: 1px solid rgba(206,212,218,.9);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15,23,42,.14);
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(104px, 1fr) auto;
        padding: 8px;
        position: static;
        top: auto;
      }
      .preview-qr-wrap {
        align-items: center;
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .preview-side {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .mobile-preview-toggle {
        display: inline-flex;
      }
      #qrcode.blank-bg {
        margin: 0;
        max-width: 138px;
        width: min(34vw, 138px);
      }
      .preview-actions {
        margin-top: 0;
      }
      .preview-panel.mobile-preview-expanded {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .preview-panel.mobile-preview-expanded #qrcode.blank-bg {
        max-width: 310px;
        width: min(76vw, 310px);
      }
      .preview-panel.mobile-preview-expanded .preview-side {
        gap: 7px;
      }
      .preview-panel.mobile-preview-expanded ~ * .font-preview-menu,
      body:has(.preview-panel.mobile-preview-expanded) .font-preview-menu {
        max-height: min(220px, calc(100dvh - 24px));
      }
      #mobileAdvancedHost #advancedSection {
        margin-bottom: 0 !important;
      }
      .range-modern {
        touch-action: pan-y;
      }
      .range-modern.mobile-horizontal-drag::-webkit-slider-thumb {
        box-shadow: 0 3px 11px rgba(13,110,253,.45);
        transform: scale(1.1);
      }
      .range-modern.mobile-horizontal-drag::-moz-range-thumb {
        box-shadow: 0 3px 11px rgba(13,110,253,.45);
        transform: scale(1.1);
      }
    }

    /* The template can make the final canvas non-square.
       Let the rendered canvas control the preview height so it is not clipped. */
    #qrcode.blank-bg {
      aspect-ratio: auto;
      min-height: 0;
      overflow: hidden;
    }

    #qrcode.blank-bg:empty {
      aspect-ratio: 1 / 1;
    }

    #qrcode.blank-bg canvas {
      display: block;
      height: auto !important;
      max-width: 100%;
      width: 100% !important;
    }


    /* Modern local color controls */
    .color-picker-container {
      min-width: 0;
    }
    .qr-paint-picker,
    .compact-paint-picker {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
    }
    .compact-paint-picker .color-display {
      height: 34px !important;
    }
    .frame-color-picker .compact-paint-picker {
      width: 100%;
    }
    .qr-paint-picker .color-label {
      background: transparent;
      box-shadow: none;
      color: #475569;
      display: block;
      font-size: 11px;
      font-weight: 700;
      left: auto;
      letter-spacing: .02em;
      margin: 0 0 6px 2px;
      padding: 0;
      position: static;
      text-transform: uppercase;
      top: auto;
    }
    .color-display {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,.06);
      height: 42px;
      overflow: hidden;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .color-display:hover,
    .color-display:focus-visible {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.14), 0 3px 10px rgba(15,23,42,.08);
      outline: 0;
      transform: translateY(-1px);
    }
    .color-display::before {
      background: var(--paint-preview, var(--color-value));
      border-radius: 9px;
      bottom: 3px;
      left: 3px;
      right: 3px;
      top: 3px;
    }
    .paint-mode-badge {
      align-items: center;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 999px;
      bottom: 7px;
      color: #334155;
      display: inline-flex;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      padding: 2px 6px;
      pointer-events: none;
      position: absolute;
      right: 7px;
      text-transform: uppercase;
      z-index: 2;
    }
    .color-picker-dropdown {
      background: rgba(255,255,255,.98);
      border: 1px solid #dbe3ee;
      border-radius: 13px;
      box-shadow: 0 14px 42px rgba(15,23,42,.18);
      box-sizing: border-box;
      max-height: calc(100dvh - 12px);

      { name:'Cyan', colors:['#083344','#164e63','#155e75','#0e7490','#0891b2','#06b6d4','#22d3ee','#67e8f9','#a5f3fc','#ecfeff'] },

      { name:'Indigo', colors:['#1e1b4b','#312e81','#3730a3','#4338ca','#4f46e5','#6366f1','#818cf8','#a5b4fc','#c7d2fe','#eef2ff'] },
      { name:'Violet', colors:['#2e1065','#4c1d95','#5b21b6','#6d28d9','#7c3aed','#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe','#f5f3ff'] },

    const hiddenHolder = $('<div>').css({
      position: 'absolute',
      left: '-9999px',
      top: '-9999px'
    }).appendTo('body')[0];

    const advancedMobileQuery = window.matchMedia('(max-width: 991.98px)');

    function placeAdvancedSection() {
      const section = document.getElementById('advancedSection');
      const mobileHost = document.getElementById('mobileAdvancedHost');
      const desktopAnchor = document.getElementById('advancedDesktopAnchor');
      if (!section || !mobileHost || !desktopAnchor) return;

      if (advancedMobileQuery.matches) {
        if (section.parentElement !== mobileHost) mobileHost.appendChild(section);
      } else if (section.previousElementSibling !== desktopAnchor) {
        desktopAnchor.insertAdjacentElement('afterend', section);
      }
    }

    placeAdvancedSection();
    if (typeof advancedMobileQuery.addEventListener === 'function') {
      advancedMobileQuery.addEventListener('change', placeAdvancedSection);
    } else {
      advancedMobileQuery.addListener(placeAdvancedSection);
    }

    function initColorPicker(displayId,pickerId,paletteId,inputId,nativeId,onChange,options = {}){
      const display=$(`#${displayId}`);
      const picker=$(`#${pickerId}`);
      const palette=$(`#${paletteId}`);
      const input=$(`#${inputId}`);
      const allowGradient=!!options.allowGradient;
      const initialColor=String(display.attr('data-color') || '#000000').toLowerCase();
      const state={
        type:'solid',
        colors:[initialColor, String(options.secondColor || (initialColor === '#ffffff' ? '#0d6efd' : '#ffffff')).toLowerCase()],
        angle:Number.isFinite(Number(options.angle)) ? Number(options.angle) : 90,
        activeStop:0,
        editorHue:[0,0],
        editorSaturation:[0,0],
        editorBrightness:[1,1]
      };

      if (allowGradient) {
        display.append('<span class="paint-mode-badge">Solid</span>');
        picker.prepend(`
          <div class="paint-mode-switch" role="group" aria-label="Color type">
            <button type="button" class="paint-mode-btn active" data-paint-mode="solid">Solid</button>
            <button type="button" class="paint-mode-btn" data-paint-mode="gradient">Gradient</button>
          </div>
          <div class="gradient-controls">
            <div class="gradient-angle-row">
              <label>Angle</label>
              <input type="range" class="form-range range-modern gradient-angle-input" min="0" max="360" step="5" value="${state.angle}" aria-label="Gradient angle">
              <span class="gradient-angle-value">${state.angle}°</span>
            </div>
          </div>`);
      }

      palette.empty().append(`
        <div class="palette-suggested-section" hidden>
          <div class="palette-section-label">Image colors</div>
          <div class="palette-image-grid"></div>
        </div>
        <div class="palette-section-label">Color shades</div>
        <div class="palette-family-grid"></div>`);

      const inputGroup=input.closest('.color-input-group');
      inputGroup.addClass('color-stop-input active').attr('data-gradient-stop','0');
      const activeChip=$('<button type="button" class="active-color-chip" aria-label="Edit this color"></button>');
      inputGroup.prepend(activeChip);

      const colorStopInputs=$('<div class="color-stop-inputs"></div>');
      if (allowGradient) picker.find('.paint-mode-switch').after(colorStopInputs);
      else picker.prepend(colorStopInputs);
      colorStopInputs.append(inputGroup);

      const colorInputs=[input];
      const colorChips=[activeChip];
      if (allowGradient) {
        const secondInput=$('<input type="text" class="color-input" pattern="^#[0-9A-Fa-f]{6}$" aria-label="Second gradient color">');
        const secondChip=$('<button type="button" class="active-color-chip" aria-label="Edit this color"></button>');
        const secondGroup=$('<div class="color-input-group color-stop-input" data-gradient-stop="1"></div>');
        secondGroup.append(secondChip,secondInput);
        colorStopInputs.append(secondGroup);
        colorInputs.push(secondInput);
        colorChips.push(secondChip);
      }

      const customEditor=$( `
        <div class="custom-color-editor">
          <div class="custom-color-editor-title"><span>Custom color</span><span class="custom-color-value"></span></div>
          <div class="custom-color-axis-grid">
            <div class="custom-axis-wrap">
              <span class="custom-axis-label">Sat</span>
              <div class="custom-saturation-slider" role="slider" aria-label="Color saturation" tabindex="0">
                <span class="custom-axis-cursor"></span>
              </div>
            </div>
            <div class="custom-color-spectrum" role="slider" aria-label="Color saturation and brightness" tabindex="0">
              <span class="custom-color-spectrum-cursor"></span>
            </div>
            <div class="custom-axis-wrap">
              <span class="custom-axis-label">Bright</span>
              <div class="custom-brightness-slider" role="slider" aria-label="Color brightness" tabindex="0">
                <span class="custom-axis-cursor"></span>
              </div>
            </div>
          </div>
          <div class="custom-hue-wrap">
            <span class="custom-hue-label">Hue</span>
            <div class="custom-hue-slider" role="slider" aria-label="Color hue" tabindex="0">
              <span class="custom-hue-cursor"></span>
            </div>
          </div>
        </div>`);
      picker.append(customEditor);

      const spectrum=customEditor.find('.custom-color-spectrum');
      const spectrumCursor=customEditor.find('.custom-color-spectrum-cursor');
      const saturationSlider=customEditor.find('.custom-saturation-slider');
      const saturationCursor=saturationSlider.find('.custom-axis-cursor');
      const brightnessSlider=customEditor.find('.custom-brightness-slider');
      const brightnessCursor=brightnessSlider.find('.custom-axis-cursor');
      const hueSlider=customEditor.find('.custom-hue-slider');
      const hueCursor=customEditor.find('.custom-hue-cursor');
      const customValue=customEditor.find('.custom-color-value');

      function clamp(value,min=0,max=1){ return Math.max(min,Math.min(max,value)); }
      function normalizeColor(col) {
        const value=String(col || '').trim();
        return /^#[0-9A-Fa-f]{6}$/.test(value) ? value.toLowerCase() : '#000000';
      }
      function hexToRgbLocal(hex){
        const value=normalizeColor(hex).slice(1);
        return {r:parseInt(value.slice(0,2),16),g:parseInt(value.slice(2,4),16),b:parseInt(value.slice(4,6),16)};
      }
      function rgbToHsvLocal(r,g,b){
        r/=255;g/=255;b/=255;
        const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
        let h=0;
        if(d){
          if(max===r) h=((g-b)/d)%6;
          else if(max===g) h=(b-r)/d+2;
          else h=(r-g)/d+4;
          h*=60;if(h<0)h+=360;
        }
        return {h,s:max===0?0:d/max,v:max};
      }
      function hsvToRgbLocal(h,s,v){
        const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
        let rp=0,gp=0,bp=0;
        if(h<60){rp=c;gp=x;} else if(h<120){rp=x;gp=c;} else if(h<180){gp=c;bp=x;}
        else if(h<240){gp=x;bp=c;} else if(h<300){rp=x;bp=c;} else {rp=c;bp=x;}
        return {r:Math.round((rp+m)*255),g:Math.round((gp+m)*255),b:Math.round((bp+m)*255)};
      }
      function rgbObjectToHex(rgb){ return rgbToHex(rgb.r,rgb.g,rgb.b); }

      // Keep HSV editor state separate from the rounded RGB hex value. This makes
      // brightness adjustments move in one clean direction and preserves hue and
      // saturation when brightness reaches zero.
      state.colors.forEach((color,index)=>{
        const rgb=hexToRgbLocal(color);
        const hsv=rgbToHsvLocal(rgb.r,rgb.g,rgb.b);
        state.editorHue[index]=hsv.h;
        state.editorSaturation[index]=hsv.s;
        state.editorBrightness[index]=hsv.v;
      });

      function getPaint() {
        return {
          type: allowGradient ? state.type : 'solid',
          color1: state.colors[0],
          color2: state.colors[1],
          angle: state.angle
        };
      }

      function updateSelectedSwatch() {
        const activeColor=state.colors[state.activeStop];
        palette.find('.color-swatch').each(function(){
          $(this).toggleClass('selected', String($(this).data('color')).toLowerCase() === activeColor);
        });
      }

      function updateCustomEditor(){
        const activeColor=state.colors[state.activeStop];
        const hue=state.editorHue[state.activeStop] || 0;
        const saturation=clamp(state.editorSaturation[state.activeStop]);
        const brightness=clamp(state.editorBrightness[state.activeStop]);

        spectrum.css('background-color',`hsl(${hue} 100% 50%)`);
        spectrumCursor.css({left:`${saturation*100}%`,top:`${(1-brightness)*100}%`});

        const saturationLow=rgbObjectToHex(hsvToRgbLocal(hue,0,brightness));
        const saturationHigh=rgbObjectToHex(hsvToRgbLocal(hue,1,brightness));
        saturationSlider.css('background',`linear-gradient(to top, ${saturationLow}, ${saturationHigh})`);
        saturationCursor.css('top',`${(1-saturation)*100}%`);

        const brightnessHigh=rgbObjectToHex(hsvToRgbLocal(hue,saturation,1));
        brightnessSlider.css('background',`linear-gradient(to top, #000000, ${brightnessHigh})`);
        brightnessCursor.css('top',`${(1-brightness)*100}%`);

        hueCursor.css('left',`${(hue/360)*100}%`);
        colorChips.forEach((chip,index)=>chip.css('background',state.colors[index]));
        customValue.text(activeColor.toUpperCase());
        spectrum.attr({'aria-valuetext':activeColor.toUpperCase(),'aria-valuenow':Math.round(saturation*100)});
        saturationSlider.attr({'aria-valuetext':`${Math.round(saturation*100)} percent`,'aria-valuenow':Math.round(saturation*100)});
        brightnessSlider.attr({'aria-valuetext':`${Math.round(brightness*100)} percent`,'aria-valuenow':Math.round(brightness*100)});
        hueSlider.attr({'aria-valuetext':`${Math.round(hue)} degrees`,'aria-valuenow':Math.round(hue)});
      }

      function updateUi(source='api', notify=true) {
        const activeColor=state.colors[state.activeStop];
        const preview=state.type === 'gradient'
          ? `linear-gradient(${state.angle}deg, ${state.colors[0]} 0%, ${state.colors[1]} 100%)`
          : state.colors[0];

        display[0].style.setProperty('--color-value', state.colors[0]);
        display[0].style.setProperty('--paint-preview', preview);
        display.data('color', state.colors[0]);
        display.data('paint-type', state.type);
        display.data('paint-color-2', state.colors[1]);
        display.data('paint-angle', state.angle);
        display.find('.paint-mode-badge').text(state.type === 'gradient' ? 'Gradient' : 'Solid');

        colorInputs.forEach((field,index)=>field.val(state.colors[index].toUpperCase()));
        colorStopInputs.toggleClass('gradient-active', allowGradient && state.type === 'gradient');
        colorStopInputs.find('.color-stop-input').each(function(){
          $(this).toggleClass('active', Number($(this).data('gradient-stop')) === state.activeStop);
        });
        updateSelectedSwatch();
        updateCustomEditor();

        if (allowGradient) {
          picker.find('.paint-mode-btn').toggleClass('active', false)
            .filter(`[data-paint-mode="${state.type}"]`).addClass('active');
          picker.find('.gradient-controls').toggleClass('show', state.type === 'gradient');
          picker.find('.gradient-angle-input').val(state.angle);
          picker.find('.gradient-angle-value').text(`${state.angle}°`);
          const angleInput=picker.find('.gradient-angle-input')[0];
          if (angleInput && typeof updateRangeFill === 'function') updateRangeFill(angleInput);
        }

        if (notify) onChange(state.colors[0], source, getPaint());
      }

      function addSwatch(col, className = '') {
        const normalized=normalizeColor(col);
        return $('<button type="button">')
          .addClass(`color-swatch ${className}`.trim())
          .css('background-color', normalized)
          .attr('data-color', normalized)
          .attr('title', normalized.toUpperCase())
          .attr('aria-label',`Choose ${normalized.toUpperCase()}`)
          .on('click', () => { setColor(normalized, 'user'); });
      }

      const familyGrid=palette.find('.palette-family-grid');
      ORGANIZED_COLOR_ROWS.forEach(row=>{
        const familyRow=$('<div class="palette-family-row">').attr('aria-label',`${row.name} shades`);
        row.colors.forEach(col=>familyRow.append(addSwatch(col)));
        familyGrid.append(familyRow);
      });

      function setSuggestedColors(colors = []) {
        const section=palette.find('.palette-suggested-section');
        const grid=palette.find('.palette-image-grid').empty();
        const unique=[...new Set(colors.map(color=>normalizeColor(color)))].slice(0,10);
        unique.forEach(col=>grid.append(addSwatch(col,'image-suggested-swatch')));
        section.prop('hidden',!unique.length);
        updateSelectedSwatch();
      }

      function setColor(col, source = 'api', hsvOverride = null){
        const index=state.activeStop;
        state.colors[index]=normalizeColor(col);

        if(hsvOverride) {
          const hue=Number(hsvOverride.h);
          state.editorHue[index]=Number.isFinite(hue) ? ((hue % 360) + 360) % 360 : state.editorHue[index];
          state.editorSaturation[index]=clamp(Number(hsvOverride.s));
          state.editorBrightness[index]=clamp(Number(hsvOverride.v));
        } else {
          const rgb=hexToRgbLocal(state.colors[index]);
          const hsv=rgbToHsvLocal(rgb.r,rgb.g,rgb.b);
          state.editorBrightness[index]=hsv.v;

          // At pure black, RGB contains no hue or saturation information. Preserve
          // the previous values so raising brightness restores the same color.
          if(hsv.v > .001) {
            state.editorSaturation[index]=hsv.s;
            if(hsv.s > .001) state.editorHue[index]=hsv.h;
          }
        }

        updateUi(source, true);
      }

      function setPaint(paint={}, source='api') {
        state.type=allowGradient && paint.type === 'gradient' ? 'gradient' : 'solid';
        state.colors[0]=normalizeColor(paint.color1 || paint.color || state.colors[0]);
        state.colors[1]=normalizeColor(paint.color2 || state.colors[1]);
        state.angle=Math.max(0, Math.min(360, Number(paint.angle) || 0));
        state.colors.forEach((color,index)=>{
          const rgb=hexToRgbLocal(color),hsv=rgbToHsvLocal(rgb.r,rgb.g,rgb.b);
          state.editorBrightness[index]=hsv.v;
          if(hsv.v > .001) {
            state.editorSaturation[index]=hsv.s;
            if(hsv.s > .001) state.editorHue[index]=hsv.h;
          }
        });
        state.activeStop=0;
        updateUi(source, true);
      }

      function setMode(mode, source='user') {
        state.type=allowGradient && mode === 'gradient' ? 'gradient' : 'solid';
        if (state.type === 'solid') state.activeStop=0;
        updateUi(source, true);
      }

      function positionPicker() {
        if (!picker.hasClass('show')) return;

        picker.css({
          transform: 'none',
          maxHeight: 'calc(100dvh - 16px)'
        });

        const rect = display[0].getBoundingClientRect();
        const viewportW = window.innerWidth;
        const viewportH = window.innerHeight;
        const pickerW = Math.min(picker.outerWidth(), viewportW - 16);
        const spaceBelow = viewportH - rect.bottom - 8;
        const spaceAbove = rect.top - 8;
        const openBelow = spaceBelow >= Math.min(picker[0].scrollHeight, 420) || spaceBelow >= spaceAbove;
        const availableH = Math.max(120, openBelow ? spaceBelow : spaceAbove);

        picker.css({
          width: `${pickerW}px`,
          maxHeight: `${Math.min(viewportH - 16, availableH)}px`
        });

        const renderedH = picker.outerHeight();
        let top = openBelow ? rect.bottom + 5 : rect.top - renderedH - 5;
        top = Math.max(8, Math.min(top, viewportH - renderedH - 8));

        let left = rect.left;
        left = Math.max(8, Math.min(left, viewportW - pickerW - 8));
        picker.css({ top: `${top}px`, left: `${left}px` });
      }

      function pointerPosition(event,element){
        const nativeEvent=event.originalEvent || event;
        const point=(nativeEvent.touches && nativeEvent.touches[0]) ||
          (nativeEvent.changedTouches && nativeEvent.changedTouches[0]) || nativeEvent;
        const rect=element.getBoundingClientRect();
        const clientX=Number(point.clientX);
        const clientY=Number(point.clientY);
        if(!Number.isFinite(clientX) || !Number.isFinite(clientY) || !rect.width || !rect.height) return null;
        return {
          x:clamp((clientX-rect.left)/rect.width),
          y:clamp((clientY-rect.top)/rect.height)
        };
      }
      function bindPointerDrag($element,onMove){
        const element=$element[0];
        let dragging=false;
        let activePointerId=null;

        function handleMove(event){
          if(!dragging) return;
          if(activePointerId !== null && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
          event.preventDefault();
          onMove(event);
        }

        function stopDrag(event){
          if(activePointerId !== null && event && event.pointerId !== undefined && event.pointerId !== activePointerId) return;
          dragging=false;
          try {
            if(activePointerId !== null && element.hasPointerCapture?.(activePointerId)) {
              element.releasePointerCapture(activePointerId);
            }
          } catch (_) {}
          activePointerId=null;
          window.removeEventListener('pointermove', handleMove, true);
          window.removeEventListener('pointerup', stopDrag, true);
          window.removeEventListener('pointercancel', stopDrag, true);
        }

        $element.on('pointerdown',function(event){
          event.preventDefault();
          event.stopPropagation();
          dragging=true;
          activePointerId=event.pointerId ?? null;
          try {
            if(activePointerId !== null) element.setPointerCapture?.(activePointerId);
          } catch (_) {}
          onMove(event);
          window.addEventListener('pointermove', handleMove, true);
          window.addEventListener('pointerup', stopDrag, true);
          window.addEventListener('pointercancel', stopDrag, true);
        });
      }
      bindPointerDrag(spectrum,event=>{
        const pos=pointerPosition(event,spectrum[0]);
        if(!pos) return;
        const index=state.activeStop;
        const hsv={
          h:state.editorHue[index] || 0,
          s:pos.x,
          v:1-pos.y
        };
        setColor(rgbObjectToHex(hsvToRgbLocal(hsv.h,hsv.s,hsv.v)),'user',hsv);
      });
      bindPointerDrag(saturationSlider,event=>{
        const pos=pointerPosition(event,saturationSlider[0]);
        if(!pos) return;
        const index=state.activeStop;
        const hsv={
          h:state.editorHue[index] || 0,
          s:1-pos.y,
          v:state.editorBrightness[index]
        };
        setColor(rgbObjectToHex(hsvToRgbLocal(hsv.h,hsv.s,hsv.v)),'user',hsv);
      });
      bindPointerDrag(brightnessSlider,event=>{
        const pos=pointerPosition(event,brightnessSlider[0]);
        if(!pos) return;
        const index=state.activeStop;
        const hsv={
          h:state.editorHue[index] || 0,
          s:state.editorSaturation[index],
          v:1-pos.y
        };
        setColor(rgbObjectToHex(hsvToRgbLocal(hsv.h,hsv.s,hsv.v)),'user',hsv);
      });
      bindPointerDrag(hueSlider,event=>{
        const pos=pointerPosition(event,hueSlider[0]);
        if(!pos) return;
        const index=state.activeStop;
        const hsv={
          h:Math.min(359.999,pos.x*360),
          s:state.editorSaturation[index],
          v:state.editorBrightness[index]
        };
        setColor(rgbObjectToHex(hsvToRgbLocal(hsv.h,hsv.s,hsv.v)),'user',hsv);
      });

      display.attr('tabindex','0').on('click keydown', e => {
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        if (e.type === 'keydown') e.preventDefault();
        e.stopPropagation();
        $('.color-picker-dropdown').not(picker).removeClass('show');
        picker.toggleClass('show');
        if (!picker.hasClass('show')) return;
        requestAnimationFrame(positionPicker);
      });

      $(window).on('resize scroll', positionPicker);

      if (allowGradient) {
        picker.on('click', '.paint-mode-btn', function(e){
          e.stopPropagation();
          setMode($(this).data('paint-mode'), 'user');
          requestAnimationFrame(positionPicker);
        });
        picker.on('input', '.gradient-angle-input', function(){
          state.angle=Math.max(0, Math.min(360, Number(this.value) || 0));
          updateUi('user', true);
        });
      }

      colorStopInputs.on('click focusin', '.color-stop-input, .active-color-chip, .color-input', function(e){
        e.stopPropagation();
        const group=$(this).closest('.color-stop-input');
        state.activeStop=Number(group.data('gradient-stop')) || 0;
        updateUi('user', false);
      });

      colorInputs.forEach((field,index)=>{
        field.on('input', e => {
          const v=e.target.value;
          if(/^#[0-9A-Fa-f]{6}$/.test(v)) {
            state.activeStop=index;
            setColor(v,'user');
          }
        });
      });
      updateUi('init', false);

      const api={setColor,setSuggestedColors,getPaint,setPaint,setMode};
      allColorPickers.push(api);
      setSuggestedColors(currentSuggestedColors);
      return api;
    }

    function rgbToHex(r, g, b) {
      return `#${[r, g, b].map(value => Math.max(0, Math.min(255, value)).toString(16).padStart(2, '0')).join('')}`;
    }

    function colorDistance(a, b) {
      // Red-mean distance better matches perceived color differences than plain RGB.
      const rMean = (a.r + b.r) / 2;
      const dr = a.r - b.r;
      const dg = a.g - b.g;
      const db = a.b - b.b;
      return Math.sqrt(
        (2 + rMean / 256) * dr * dr +
        4 * dg * dg +
        (2 + (255 - rMean) / 256) * db * db
      );
    }

    function extractDominantColors(img, maxColors = 10) {
      if (!img || !(img.naturalWidth || img.width) || !(img.naturalHeight || img.height)) return [];

      const sourceWidth = img.naturalWidth || img.width;
      const sourceHeight = img.naturalHeight || img.height;
      const maxSampleDimension = 420;
      const scale = Math.min(1, maxSampleDimension / Math.max(sourceWidth, sourceHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sourceWidth * scale));
      canvas.height = Math.max(1, Math.round(sourceHeight * scale));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      try {
        // Nearest-neighbor sampling preserves actual source pixel values instead of
        // creating averaged colors during the analysis resize.
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const buckets = new Map();
        const bucketStep = 8;

        for (let i = 0; i < pixels.length; i += 4) {
          const alpha = pixels[i + 3];
          if (alpha < 160) continue;

          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];
          const bucketR = Math.floor(r / bucketStep);
          const bucketG = Math.floor(g / bucketStep);
          const bucketB = Math.floor(b / bucketStep);
          const bucketKey = `${bucketR},${bucketG},${bucketB}`;
          const exactKey = `${r},${g},${b}`;
          let bucket = buckets.get(bucketKey);

          if (!bucket) {
            bucket = { count: 0, exact: new Map() };
            buckets.set(bucketKey, bucket);
          }

          bucket.count += 1;
          bucket.exact.set(exactKey, (bucket.exact.get(exactKey) || 0) + 1);
        }

        // Each cluster is represented by a real pixel from the image—the most
        // frequent exact color inside that cluster—rather than an averaged shade.
        const ranked = [...buckets.values()]
          .map(bucket => {
            let representative = null;
            let representativeCount = -1;
            bucket.exact.forEach((count, key) => {
              if (count > representativeCount) {
                representativeCount = count;
                representative = key;
              }
            });
            const [r, g, b] = representative.split(',').map(Number);
            return { r, g, b, count: bucket.count, exactCount: representativeCount };
          })
          .sort((a, b) => (b.count - a.count) || (b.exactCount - a.exactCount));

        const selected = [];
        const minimumDistance = 36;
        for (const candidate of ranked) {
          if (selected.every(existing => colorDistance(candidate, existing) >= minimumDistance)) {
            selected.push(candidate);
            if (selected.length >= maxColors) break;
          }
        }

        // If the image contains only very similar shades, fill remaining slots with
        // the next most common exact colors instead of returning fewer unnecessarily.
        if (selected.length < maxColors) {
          for (const candidate of ranked) {
            if (selected.some(existing => existing.r === candidate.r && existing.g === candidate.g && existing.b === candidate.b)) continue;
            if (selected.every(existing => colorDistance(candidate, existing) >= 18)) {
              selected.push(candidate);
              if (selected.length >= maxColors) break;
            }
          }
        }

        return selected.map(color => rgbToHex(color.r, color.g, color.b));
      } catch (error) {
        return [];
      }
    }

    function installMobileRangeGuards() {
      document.querySelectorAll('.range-modern').forEach(input => {
        if (input.dataset.mobileRangeGuard === '1') return;
        input.dataset.mobileRangeGuard = '1';
        let gesture = null;
        const threshold = 8;

        const restoreStartValue = () => {
          if (!gesture) return;
          input.value = gesture.startValue;
          updateRangeFill(input);
        };

        input.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse') return;
          gesture = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startValue: input.value,
            mode: 'pending'
          };
        }, true);

        input.addEventListener('pointermove', event => {
          if (!gesture || gesture.pointerId !== event.pointerId) return;
          const dx = event.clientX - gesture.startX;
          const dy = event.clientY - gesture.startY;
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);

          if (gesture.mode === 'pending' && Math.max(absX, absY) >= threshold) {
            if (absY > absX * 1.15) {
              gesture.mode = 'vertical';
              restoreStartValue();
            } else if (absX > absY * 1.15) {
              gesture.mode = 'horizontal';
              input.classList.add('mobile-horizontal-drag');
              try { input.setPointerCapture(event.pointerId); } catch (_) {}
            }
          }

          if (gesture.mode === 'vertical') {
            restoreStartValue();
          } else if (gesture.mode === 'horizontal' && event.cancelable) {
            event.preventDefault();
          }
        }, { capture: true, passive: false });

        // Ignore native slider changes until the gesture clearly becomes horizontal.
        input.addEventListener('input', event => {
          if (!gesture || gesture.mode === 'horizontal') return;
          restoreStartValue();
          event.stopImmediatePropagation();
        }, true);

        const finishGesture = event => {
          if (!gesture || (event && gesture.pointerId !== event.pointerId)) return;
          if (gesture.mode !== 'horizontal') restoreStartValue();
          input.classList.remove('mobile-horizontal-drag');
          gesture = null;
        };

        input.addEventListener('pointerup', finishGesture, true);
        input.addEventListener('pointercancel', finishGesture, true);
        input.addEventListener('lostpointercapture', finishGesture, true);
      });
    }

    function initTemplateFontPreviewPicker() {
      const select = $('#templateFont');
      const picker = $('#templateFontPicker');
      const button = $('#templateFontButton');
      const buttonText = $('#templateFontButtonText');
      const menu = $('#templateFontMenu');

      function closePicker() {
        picker.removeClass('open');
        button.attr('aria-expanded', 'false');
        menu.removeClass('open-up').css('max-height', '');
      }

      function fitMenuToViewport() {
        if (!picker.hasClass('open') || !button[0]) return;

        menu.removeClass('open-up').css('max-height', '');
        const rect = button[0].getBoundingClientRect();
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        const gap = 8;
        const availableBelow = Math.max(0, viewportHeight - rect.bottom - gap);
        const availableAbove = Math.max(0, rect.top - gap);
        const openUp = availableBelow < 180 && availableAbove > availableBelow;
        const available = openUp ? availableAbove : availableBelow;
        const maxHeight = Math.max(52, Math.min(310, Math.floor(available - 4)));

        menu.toggleClass('open-up', openUp).css('max-height', `${maxHeight}px`);
      }

      function updateSelectedPreview() {
        const option = select.find('option:selected');
        const value = option.val() || 'Arial, sans-serif';
        const label = option.text() || 'Arial';
        buttonText.text(label).css('font-family', value);
        menu.find('.font-preview-option')
          .removeClass('selected')
          .attr('aria-selected', 'false')
          .filter(function(){ return $(this).attr('data-value') === value; })
          .addClass('selected')
          .attr('aria-selected', 'true');
      }

      function addOption(option) {
        const $option = $(option);
        const value = $option.val();
        const label = $option.text();
        const item = $('<button>', {
          type: 'button',
          class: 'font-preview-option',
          role: 'option',
          'data-value': value,
          'aria-selected': 'false'
        });
        $('<span>', { class: 'font-preview-sample', text: 'Aa' })
          .css('font-family', value)
          .appendTo(item);
        $('<span>', { class: 'font-preview-name', text: label })
          .css('font-family', value)
          .appendTo(item);
        item.on('click', function() {
          if (select.val() !== value) select.val(value).trigger('change');
          updateSelectedPreview();
          closePicker();
          button.trigger('focus');
        });
        menu.append(item);
      }

      select.children().each(function() {
        if (this.tagName === 'OPTGROUP') {
          $('<div>', {
            class: 'font-preview-group-label',
            text: this.label
          }).appendTo(menu);
          $(this).children('option').each(function(){ addOption(this); });
        } else if (this.tagName === 'OPTION') {
          addOption(this);
        }
      });

      button.on('click', function(event) {
        event.stopPropagation();
        const opening = !picker.hasClass('open');
        $('.font-preview-picker').not(picker)
          .removeClass('open')
          .find('.font-preview-button')
          .attr('aria-expanded', 'false');
        picker.toggleClass('open', opening);
        button.attr('aria-expanded', opening ? 'true' : 'false');
        if (opening) {
          fitMenuToViewport();
          const selected = menu.find('.font-preview-option.selected')[0];
          if (selected) selected.scrollIntoView({ block: 'nearest' });
        }
      });

      button.on('keydown', function(event) {
        if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (!picker.hasClass('open')) button.trigger('click');
          const selected = menu.find('.font-preview-option.selected');
          (selected.length ? selected : menu.find('.font-preview-option').first()).trigger('focus');
        } else if (event.key === 'Escape') {
          closePicker();
        }
      });

      menu.on('keydown', '.font-preview-option', function(event) {
        const items = menu.find('.font-preview-option');
        const index = items.index(this);
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          items.eq(Math.min(index + 1, items.length - 1)).trigger('focus');
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
